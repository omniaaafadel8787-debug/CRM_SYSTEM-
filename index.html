<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KEYORA CRM | نظام إدارة العقارات والعملاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --emerald: #0b3b2c;
    --emerald-dark: #07281e;
    --emerald-light: #13523e;
    --gold: #c8a252;
    --gold-light: #f4ebd9;
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #1c2421;
    --muted: #62706b;
    --border: #e2ddd2;
    --danger: #b91c1c;
    --warning: #b45309;
    --success: #15803d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'IBM Plex Sans Arabic', sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
  button, input, select, textarea { font-family: inherit; }

  /* Login Overlay */
  #loginScreen {
    position: fixed; inset: 0; background: linear-gradient(145deg, var(--emerald-dark), var(--emerald));
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 9999;
  }
  .login-card {
    background: var(--card); border-radius: 22px; padding: 28px 22px; width: 100%; max-width: 400px;
    border: 2px solid var(--gold); box-shadow: 0 20px 50px rgba(0,0,0,0.35); text-align: center;
  }
  .login-card h1 { color: var(--emerald); font-size: 24px; margin-top: 10px; font-weight: 700; }
  .login-card p { color: var(--muted); font-size: 13px; margin: 6px 0 18px; }
  .field-group { text-align: start; margin-bottom: 12px; }
  .field-group label { display: block; font-size: 12px; font-weight: 600; color: var(--emerald); margin-bottom: 4px; }
  .field-group input, .field-group select, .field-group textarea {
    width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 12px;
    font-size: 14px; background: #fbfaf7; color: var(--text); outline: none;
  }
  .field-group input:focus, .field-group select:focus, .field-group textarea:focus { border-color: var(--gold); background: #fff; }
  .btn-primary {
    width: 100%; padding: 12px; border: none; border-radius: 12px; background: var(--emerald);
    color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s;
  }
  .btn-primary:hover { background: var(--emerald-light); }
  .btn-gold {
    padding: 10px 14px; border: 1.5px solid var(--gold); border-radius: 12px; background: var(--gold-light);
    color: var(--emerald-dark); font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .btn-outline {
    padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 11px; background: #fff;
    color: var(--emerald); font-weight: 600; font-size: 13px; cursor: pointer;
  }

  /* Header */
  .container { max-width: 960px; margin: 0 auto; padding: 12px; }
  .top-banner {
    background: linear-gradient(135deg, var(--emerald-dark), var(--emerald));
    color: #fff; border-radius: 20px; padding: 16px; border: 1.5px solid var(--gold);
    box-shadow: 0 8px 24px rgba(11,59,44,0.18); margin-bottom: 12px;
  }
  .header-top-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px;
  }
  .brand-box { display: flex; align-items: center; gap: 10px; }
  .brand-info h2 { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.4px; }
  .brand-info .rep-name { font-size: 13px; color: var(--gold-light); font-weight: 600; }
  .brand-info .rep-code { font-size: 11px; color: var(--gold); font-weight: 700; }
  .header-controls { display: flex; flex-direction: column; gap: 6px; min-width: 125px; }
  .ctrl-btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(200,162,82,0.55); color: var(--gold-light);
    padding: 7px 12px; border-radius: 11px; font-size: 13px; font-weight: 700; cursor: pointer;
    text-align: center; white-space: nowrap;
  }
  .ctrl-btn:hover { background: rgba(200,162,82,0.2); }

  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .contact-chip {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(200,162,82,0.35);
    border-radius: 11px; padding: 7px 10px; font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .contact-chip span { color: var(--gold-light); font-weight: 600; }
  .contact-chip input {
    background: transparent; border: none; color: #fff; font-size: 12px; width: 100%; outline: none; text-align: end;
  }
  .action-chip {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(200,162,82,0.45); color: #fff;
    border-radius: 11px; padding: 9px 10px; font-size: 13px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
  }
  .action-chip.backup-btn { background: var(--emerald-light); border-color: var(--gold); }

  /* Team Bar & KPIs */
  .team-bar {
    background: #fff; border: 1.5px solid var(--border); border-radius: 15px; padding: 10px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px;
  }
  .team-bar label { font-size: 12px; font-weight: 700; color: var(--emerald); white-space: nowrap; }
  .team-bar select { flex: 1; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--border); font-size: 13px; background: #fbfaf7; }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .kpi-card {
    background: #fff; border: 1.5px solid var(--border); border-top: 3px solid var(--emerald);
    border-radius: 14px; padding: 10px 6px; text-align: center; cursor: pointer;
  }
  .kpi-card.gold-top { border-top-color: var(--gold); }
  .kpi-tag {
    display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 8px;
    background: #eef5f2; color: var(--emerald); margin-bottom: 4px;
  }
  .kpi-card.gold-top .kpi-tag { background: var(--gold-light); color: #8a641b; }
  .kpi-val { font-size: 16px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
  .kpi-lbl { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Section Card */
  .section-card {
    background: #fff; border: 1.5px solid var(--border); border-radius: 20px; padding: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.04);
  }
  .sec-header {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 12px;
  }
  .sec-title-wrap h3 { font-size: 17px; font-weight: 700; color: var(--emerald); }
  .sec-title-wrap p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .back-btn {
    background: var(--gold-light); border: 1.5px solid var(--gold); color: var(--emerald-dark);
    border-radius: 10px; padding: 6px 11px; font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0;
  }
  .toolbar-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .search-input {
    width: 100%; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: 12px;
    font-size: 13px; margin-bottom: 10px; background: #fbfaf7;
  }

  /* Item Cards */
  .item-card {
    background: #fbfaf7; border: 1.5px solid var(--border); border-radius: 15px; padding: 13px;
    margin-bottom: 10px; cursor: pointer; transition: 0.15s;
  }
  .item-card:hover { border-color: var(--gold); background: #fff; }
  .item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .badge-type {
    background: var(--emerald); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 8px;
  }
  .item-title { font-weight: 700; font-size: 14px; color: var(--emerald-dark); }
  .item-price { font-weight: 700; font-size: 15px; color: var(--emerald); }
  .item-meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .item-actions {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border);
  }
  .mini-btn {
    padding: 5px 10px; border-radius: 9px; font-size: 12px; font-weight: 700; border: 1px solid var(--border);
    background: #fff; color: var(--emerald); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
  }
  .mini-btn.wa { background: #e8f8ee; border-color: #86efac; color: #166534; }
  .mini-btn.del { background: #fef2f2; border-color: #fecaca; color: var(--danger); }

  /* Tables for Companies & Brokers */
  .table-wrap { overflow-x: auto; border: 1.5px solid var(--border); border-radius: 14px; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; min-width: 780px; font-size: 12px; }
  th { background: var(--emerald); color: var(--gold-light); padding: 10px 8px; text-align: start; white-space: nowrap; }
  td { padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr.alert-7 { background: #fefce8; }
  tr.alert-14 { background: #fef2f2; }
  .pill { display: inline-block; padding: 3px 8px; border-radius: 8px; font-weight: 700; font-size: 11px; }
  .pill-ok { background: #dcfce7; color: #166534; }
  .pill-7 { background: #fef3c7; color: #92400e; }
  .pill-14 { background: #fee2e2; color: #991b1b; }

  /* Drawer */
  #drawerBackdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9000; display: none;
  }
  #sectionsDrawer {
    position: fixed; top: 0; bottom: 0; inset-inline-start: 0; width: 85%; max-width: 340px;
    background: #fff; z-index: 9001; padding: 16px; overflow-y: auto; display: none;
    box-shadow: 0 0 30px rgba(0,0,0,0.25);
  }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px;
    border-bottom: 1.5px solid var(--border); margin-bottom: 12px;
  }
  .nav-group { border: 1px solid var(--border); border-radius: 13px; margin-bottom: 8px; overflow: hidden; }
  .nav-group-btn {
    width: 100%; background: #fbfaf7; border: none; padding: 11px 12px; font-weight: 700; font-size: 13px;
    color: var(--emerald); display: flex; justify-content: space-between; align-items: center; cursor: pointer;
  }
  .nav-group-items { padding: 6px; display: flex; flex-direction: column; gap: 5px; background: #fff; }
  .nav-group-items.collapsed { display: none; }
  .nav-item {
    width: 100%; text-align: start; padding: 9px 11px; border-radius: 10px; border: 1px solid transparent;
    background: #f8f7f3; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  .nav-item.active { background: var(--emerald); color: #fff; }
  .nav-badge { background: var(--gold); color: var(--emerald-dark); font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 9px; }

  /* Modals */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 9500;
    display: none; align-items: center; justify-content: center; padding: 14px;
  }
  .modal-box {
    background: #fff; border-radius: 20px; border: 2px solid var(--gold); width: 100%; max-width: 560px;
    max-height: 88vh; overflow-y: auto; padding: 18px;
  }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border);
    padding-bottom: 10px; margin-bottom: 12px;
  }
  .modal-head h4 { color: var(--emerald); font-size: 16px; font-weight: 700; }
  .detail-row {
    background: #fbfaf7; border: 1px solid var(--border); border-radius: 11px; padding: 9px 12px; margin-bottom: 8px;
  }
  .detail-row .lbl { font-size: 11px; color: var(--muted); font-weight: 600; }
  .detail-row .val { font-size: 14px; color: var(--text); font-weight: 700; margin-top: 2px; word-break: break-word; }

  /* Visual Install Guide */
  .guide-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 10px; }
  @media (min-width: 720px) { .guide-grid { grid-template-columns: 1fr 1fr; } }
  .guide-col { background: #fbfaf7; border: 1.5px solid var(--border); border-radius: 16px; padding: 12px; }
  .guide-col h4 { background: #e8f1ee; color: var(--emerald); padding: 8px 12px; border-radius: 10px; font-size: 13px; text-align: center; margin-bottom: 10px; }
  .step-box { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 8px; text-align: center; }
  .step-box p { font-size: 12px; font-weight: 700; color: var(--text); margin-top: 6px; }

  /* Toast */
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--emerald-dark); color: #fff; border: 1.5px solid var(--gold);
    padding: 10px 18px; border-radius: 14px; font-size: 13px; font-weight: 700;
    z-index: 99999; display: none; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: fixed; inset: 0; background: #fff; padding: 24px; }
    .no-print { display: none !important; }
  }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen">
  <div class="login-card">
    <div style="display:flex;justify-content:center;">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
        <rect x="2" y="2" width="60" height="60" rx="14" fill="#0b3b2c" stroke="#c8a252" stroke-width="2.5"/>
        <path d="M16 48V24L26 18V48H16Z" fill="#c8a252"/>
        <path d="M29 48V14L40 20V48H29Z" fill="#e5c780"/>
        <path d="M43 48V27L50 31V48H43Z" fill="#c8a252"/>
        <rect x="13" y="48" width="38" height="3" rx="1.5" fill="#f4ebd9"/>
      </svg>
    </div>
    <h1>KEYORA CRM</h1>
    <p id="loginSub">نظام إدارة العقارات والعملاء والشركات</p>
    <div class="field-group">
      <label id="lblRepName">الاسم / Name</label>
      <input type="text" id="inRepName" placeholder="">
    </div>
    <div class="field-group">
      <label id="lblRepCode">كود التفعيل / Activation Code</label>
      <input type="text" id="inRepCode" placeholder="">
    </div>
    <div class="field-group">
      <label id="lblRepPhone">رقم الهاتف / Phone</label>
      <input type="tel" id="inRepPhone" placeholder="">
    </div>
    <div class="field-group">
      <label id="lblRepWa">رقم الواتساب / WhatsApp</label>
      <input type="tel" id="inRepWa" placeholder="">
    </div>
    <button class="btn-primary" onclick="handleLogin()" id="btnLogin">دخول للنظام</button>
    <div id="loginErr" style="color:#b91c1c;font-size:12px;font-weight:700;margin-top:8px;"></div>
  </div>
</div>

<!-- Main App -->
<div class="container" id="mainApp" style="display:none;">
  <!-- Top Emerald Banner -->
  <div class="top-banner">
    <div class="header-top-row">
      <div class="brand-box">
        <svg width="48" height="48" viewBox="0 0 64 64" fill="none">
          <rect x="2" y="2" width="60" height="60" rx="14" fill="#07281e" stroke="#c8a252" stroke-width="2.5"/>
          <path d="M16 48V24L26 18V48H16Z" fill="#c8a252"/>
          <path d="M29 48V14L40 20V48H29Z" fill="#e5c780"/>
          <path d="M43 48V27L50 31V48H43Z" fill="#c8a252"/>
          <rect x="13" y="48" width="38" height="3" rx="1.5" fill="#f4ebd9"/>
        </svg>
        <div class="brand-info">
          <h2>KEYORA CRM</h2>
          <div class="rep-name" id="dispName"></div>
          <div class="rep-code" id="dispCode"></div>
        </div>
      </div>
      <div class="header-controls">
        <button class="ctrl-btn" id="btnSections" dir="ltr" onclick="toggleDrawer(true)">≡ الأقسام</button>
        <button class="ctrl-btn" id="btnLang" onclick="toggleLang()">English</button>
      </div>
    </div>

    <div class="contact-grid">
      <div class="contact-chip">
        <span id="lblTopPhone">هاتف:</span>
        <input type="tel" id="topPhoneInput" oninput="saveProfilePhones()">
      </div>
      <div class="contact-chip">
        <span id="lblTopWa">واتساب:</span>
        <input type="tel" id="topWaInput" oninput="saveProfilePhones()">
      </div>
      <a class="action-chip" id="topCallLink" href="#">📞 <span id="txtTopCall">اتصال</span></a>
      <a class="action-chip" id="topWaLink" href="#" target="_blank">💬 <span id="txtTopWa">واتساب</span></a>
      <button class="action-chip" onclick="switchSection('chat')">💭 <span id="txtTopChat">شات</span> (<span id="chatCount">0</span>)</button>
      <button class="action-chip backup-btn" onclick="exportFullBackup()">📥 <span id="txtTopBackup">حفظ Excel</span></button>
    </div>
  </div>

  <!-- Team Filter -->
  <div class="team-bar">
    <label id="lblTeamFilter">متابعة الفريق:</label>
    <select id="teamSelect" onchange="renderActiveSection()">
      <option value="ALL">الكل (جميع السيلز)</option>
    </select>
    <button class="btn-primary" style="width:auto;padding:7px 12px;font-size:12px;" onclick="openTeamModal()" id="btnManageTeam">إدارة الفريق</button>
  </div>

  <!-- KPI Summary -->
  <div class="kpi-grid">
    <div class="kpi-card" onclick="switchSection('sale')">
      <div class="kpi-tag" id="kpiTagSale">بيع</div>
      <div class="kpi-val" id="kpiSale">0</div>
      <div class="kpi-lbl" id="kpiLblSale">المتاح للبيع</div>
    </div>
    <div class="kpi-card" onclick="switchSection('resale')">
      <div class="kpi-tag" id="kpiTagResale">ريسيل</div>
      <div class="kpi-val" id="kpiResale">0</div>
      <div class="kpi-lbl" id="kpiLblResale">ريسيل ولانشات</div>
    </div>
    <div class="kpi-card gold-top" onclick="switchSection('requests')">
      <div class="kpi-tag" id="kpiTagReq">طلب</div>
      <div class="kpi-val" id="kpiReq">0</div>
      <div class="kpi-lbl" id="kpiLblReq">طلبات العملاء</div>
    </div>
    <div class="kpi-card gold-top" onclick="switchSection('commissions')">
      <div class="kpi-tag" id="kpiTagComm">عمولة</div>
      <div class="kpi-val" id="kpiComm">0</div>
      <div class="kpi-lbl" id="kpiLblComm">العمولات المتوقعة</div>
    </div>
  </div>

  <!-- Active Section Host -->
  <div class="section-card" id="sectionHost"></div>
</div>

<!-- Drawer -->
<div id="drawerBackdrop" onclick="toggleDrawer(false)"></div>
<div id="sectionsDrawer">
  <div class="drawer-head">
    <div style="display:flex;align-items:center;gap:8px;">
      <svg width="34" height="34" viewBox="0 0 64 64" fill="none">
        <rect x="2" y="2" width="60" height="60" rx="14" fill="#0b3b2c" stroke="#c8a252" stroke-width="2.5"/>
        <path d="M16 48V24L26 18V48H16Z" fill="#c8a252"/>
        <path d="M29 48V14L40 20V48H29Z" fill="#e5c780"/>
        <path d="M43 48V27L50 31V48H43Z" fill="#c8a252"/>
      </svg>
      <div>
        <div style="font-weight:700;color:var(--emerald);font-size:14px;">KEYORA CRM</div>
        <div style="font-size:11px;color:var(--gold);font-weight:700;" id="drawerCode"></div>
      </div>
    </div>
    <button class="btn-outline" onclick="toggleDrawer(false)">✕</button>
  </div>
  <div id="drawerGroups"></div>
  <button class="nav-item" style="margin-top:10px;background:#fef2f2;color:#b91c1c;justify-content:center;" onclick="logout()" id="btnLogout">تسجيل الخروج</button>
</div>

<!-- Universal Modal -->
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()">
  <div class="modal-box" id="modalContent"></div>
</div>

<input type="file" id="excelFileInput" accept=".xlsx,.xls,.csv" style="display:none;" onchange="handleExcelImport(event)">
<div id="toast"></div>

<script>
// Valid Codes
const VALID_CODES = new Set(['MGR-2026']);
for (let i = 1; i <= 20; i++) VALID_CODES.add('TEAM-MGR-' + String(i).padStart(2, '0'));
for (let i = 101; i <= 150; i++) VALID_CODES.add('SLS-' + i);

// App State (Starts completely empty for every new user)
let state = {
  lang: 'ar',
  user: null,
  activeSection: 'sale',
  prevSection: 'sale',
  importTarget: 'sale',
  searchQuery: '',
  teamMembers: [],
  units: [],       // {id, category:'sale'|'commercial'|'resale', type, project, location, building, unitNo, floor, area, pricePerMeter, price, furnishedPrice, garden, terrace, finishing, paymentPlan, delivery, direction, view, formNo, notes}
  requests: [],    // {id, clientName, phone, reqType, area, budget, paymentPlan, status, rep, notes}
  commissions: [], // {id, title, dealValue, rate, commValue, status, rep, notes}
  viewings: [],    // {id, clientName, phone, project, unitNo, date, time, period:'AM'|'PM', status, rep, notes}
  owners: [],      // {id, name, ownerPhone, adminPhone, address, salesCount, soldUnits, project, unitNo, building, floor, lastFollowup, comments, links}

const STORAGE_KEY = 'KEYORA_CRM_V3_CLEAN';

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && saved.user) {
      state = { ...state, ...saved };
    }
  } catch (e) {}
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2800);
}

function handleLogin() {
  const name = document.getElementById('inRepName').value.trim();
  const code = document.getElementById('inRepCode').value.trim().toUpperCase();
  const phone = document.getElementById('inRepPhone').value.trim();
  const wa = document.getElementById('inRepWa').value.trim() || phone;
  if (!name) { document.getElementById('loginErr').textContent = 'يرجى إدخال الاسم'; return; }
  if (!VALID_CODES.has(code)) { document.getElementById('loginErr').textContent = 'كود التفعيل غير صحيح'; return; }
  state.user = { name, code, phone, wa };
  if (state.teamMembers.length === 0) state.teamMembers = [name];
  saveState();
  initApp();
}

function logout() {
  state.user = null;
  saveState();
  location.reload();
}

function initApp() {
  if (!state.user) return;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  applyLangUI();
  renderTeamSelect();
  updateKPIs();
  renderActiveSection();
}

function toggleLang() {
  state.lang = state.lang === 'ar' ? 'en' : 'ar';
  saveState();
  applyLangUI();
  renderActiveSection();
}

  state.user.phone = document.getElementById('topPhoneInput').value.trim();

  saveState();
  updateTopLinks();
}

function cleanPhoneForWa(raw) {
  let d = String(raw || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('01') && d.length === 11) d = '2' + d;
  return d;
}

function updateTopLinks() {
  const p = String(state.user.phone || '').replace(/\s+/g, '');
  const w = cleanPhoneForWa(state.user.wa || state.user.phone);
  document.getElementById('topCallLink').href = p ? ('tel:' + p) : '#';
  document.getElementById('topWaLink').href = w ? ('https://wa.me/' + w) : 'https://wa.me/';
}

function renderTeamSelect() {
  const sel = document.getElementById('teamSelect');
  const cur = sel.value;
  sel.innerHTML = `<option value="ALL">${t('allSales')}</option>` +
    state.teamMembers.map(m => `<option value="${m}">${m}</option>`).join('');
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
}

function updateKPIs() {
  const saleCount = state.units.filter(u => u.category === 'sale' || u.category === 'commercial').length;
  const resaleCount = state.units.filter(u => u.category === 'resale').length;
  const reqCount = state.requests.length;
  const unitsSum = state.units.reduce((acc, u) => acc + (Number(u.price) || 0), 0);
  const manualComm = state.commissions.reduce((acc, c) => acc + (Number(c.commValue) || 0), 0);
  const estComm = manualComm > 0 ? manualComm : Math.round(unitsSum * 0.025);

  document.getElementById('kpiSale').textContent = saleCount;
  document.getElementById('kpiResale').textContent = resaleCount;
  document.getElementById('kpiReq').textContent = reqCount;
  document.getElementById('kpiComm').textContent = estComm.toLocaleString();
  document.getElementById('chatCount').textContent = state.chat.length;
  renderDrawer();
}

function toggleDrawer(open) {
  document.getElementById('drawerBackdrop').style.display = open ? 'block' : 'none';
  document.getElementById('sectionsDrawer').style.display = open ? 'block' : 'none';
}

function renderDrawer() {
  const groups = [
    {
      title: t('grpUnits'),
      items: [
        { id: 'sale', label: t('sec_sale'), count: state.units.filter(u => u.category === 'sale').length },
        { id: 'commercial', label: t('sec_commercial'), count: state.units.filter(u => u.category === 'commercial').length },
        { id: 'resale', label: t('sec_resale'), count: state.units.filter(u => u.category === 'resale').length }
      ]
    },
    {
      title: t('grpClients'),
      items: [
        { id: 'requests', label: t('sec_requests'), count: state.requests.length },
        { id: 'commissions', label: t('sec_commissions'), count: state.commissions.length },
        { id: 'matching', label: t('sec_matching') },
        { id: 'viewings', label: t('sec_viewings'), count: state.viewings.length }
      ]
    },
    {
      title: t('grpCompanies'),
      items: [
        { id: 'owners', label: t('sec_owners'), count: state.owners.length },
        { id: 'brokers', label: t('sec_brokers'), count: state.brokers.length }
      ]
    },
    {
      title: t('grpTools'),
      items: [
        { id: 'projects', label: t('sec_projects'), count: state.projects.length },
        { id: 'ads', label: t('sec_ads') },
        { id: 'broadcast', label: t('sec_broadcast') },
        { id: 'help', label: t('sec_help') }
      ]
    }
  ];

  const host = document.getElementById('drawerGroups');
  host.innerHTML = groups.map((g, idx) => `
    <div class="nav-group">
      <button class="nav-group-btn" onclick="this.nextElementSibling.classList.toggle('collapsed')">
        <span>${g.title}</span><span>▾</span>
      </button>
      <div class="nav-group-items">
        ${g.items.map(it => `
          <button class="nav-item ${state.activeSection === it.id ? 'active' : ''}" onclick="switchSection('${it.id}');toggleDrawer(false);">
            <span>${it.label}</span>
            ${it.count !== undefined ? `<span class="nav-badge">${it.count}</span>` : ''}
          </button>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function switchSection(sec) {
  if (sec !== state.activeSection) {
    state.prevSection = state.activeSection;
    state.activeSection = sec;
    state.searchQuery = '';
    saveState();
  }
  renderDrawer();
  renderActiveSection();
}

function goBackSection() {
  const target = state.prevSection && state.prevSection !== state.activeSection ? state.prevSection : 'sale';
  switchSection(target);
}

function secHeaderHtml(titleKey, subText) {
  return `
    <div class="sec-header">
      <div class="sec-title-wrap">
        <h3>${t(titleKey)}</h3>
        <p>${subText || ''}</p>
      </div>
      <button class="back-btn" onclick="goBackSection()">${t('back')}</button>
    </div>
  `;
}

function sendChat() {
  const inp = document.getElementById('chatMsgIn');
  const txt = inp.value.trim();
  if (!txt) return;
  state.chat.push({ id: uid(), sender: state.user.name, text: txt, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
  saveState();
  updateKPIs();
  renderActiveSection();
}

// Helpers
function uid() { return 'id_' + Math.random().toString(36).slice(2, 10); }
function daysSince(dateStr) {
  if (!dateStr) return 0;
  const d = new Date(dateStr);
  if (isNaN(d)) return 0;
  return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
}
function renderLinksHtml(raw) {
  if (!raw) return '-';
  const parts = String(raw).split(/[\s
,]+/).filter(Boolean);
  return parts.map((p, idx) => p.startsWith('http') ? `<a href="${p}" target="_blank" class="mini-btn" style="margin:2px;">🔗 رابط ${idx+1}</a>` : p).join(' ');
}
function copyText(txt) {
  navigator.clipboard?.writeText(txt);
  showToast('تم النسخ بنجاح');
}
function deleteItem(col, id) {
  state[col] = state[col].filter(x => x.id !== id);
  saveState();
  updateKPIs();
  renderActiveSection();
}

function formatUnitText(u) {
  return [
    `🏢 ${u.type || 'وحدة عقارية'} - ${u.project || ''}`,
    u.unitNo ? `رقم الوحدة: ${u.unitNo}` : '',
    u.building ? `العمارة: ${u.building}` : '',
    u.floor ? `الدور: ${u.floor}` : '',
    u.area ? `المساحة: ${u.area} م²` : '',
    u.price ? `السعر: ${Number(u.price).toLocaleString()} ج.م` : '',
    u.finishing ? `التشطيب: ${u.finishing}` : '',
    u.paymentPlan ? `نظام السداد: ${u.paymentPlan}` : '',
    u.notes ? `ملاحظات: ${u.notes}` : ''
  ].filter(Boolean).join('
');
}

function buildUnitWaLink(u) {

// Smart Multi-Sheet & Horizontal/Vertical Excel Importer
function triggerImport(targetSec) {
  state.importTarget = targetSec;
  const inp = document.getElementById('excelFileInput');
  inp.value = '';
  inp.click();
}

function handleExcelImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
      let importedCount = 0;
      const target = state.importTarget;

      wb.SheetNames.forEach(sheetName => {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
        if (!rows || rows.length < 2) return;

        if (target === 'sale' || target === 'commercial' || target === 'resale') {
          const parsedUnits = parseAnyUnitsSheet(rows, sheetName, target);
          state.units.unshift(...parsedUnits);
          importedCount += parsedUnits.length;
        } else if (target === 'requests') {
          const parsed = parseTableByHeaders(rows, (map, r) => ({
            id: uid(),
            clientName: getCol(r, map, ['العميل', 'اسم العميل', 'client', 'name']) || 'عميل',
            phone: String(getCol(r, map, ['الهاتف', 'رقم الهاتف', 'موبايل', 'phone', 'mobile']) || ''),
            reqType: getCol(r, map, ['النوع', 'نوع العقار', 'المطلوب', 'type']) || '',
            area: getCol(r, map, ['المنطقة', 'المشروع', 'area', 'location']) || '',
            budget: parseNum(getCol(r, map, ['الميزانية', 'السعر', 'budget', 'price'])),
            rep: getCol(r, map, ['السيلز', 'rep', 'sales']) || state.user.name,
            notes: getCol(r, map, ['ملاحظات', 'notes']) || '',
            status: 'جديد'
          }));
          state.requests.unshift(...parsed);
          importedCount += parsed.length;
        } else if (target === 'owners') {
          const parsed = parseTableByHeaders(rows, (map, r) => ({
            id: uid(),
            name: getCol(r, map, ['الشركة', 'اسم الشركة', 'company', 'name']) || sheetName,
            ownerPhone: String(getCol(r, map, ['صاحب الشركة', 'رقم صاحب', 'owner']) || ''),
            adminPhone: String(getCol(r, map, ['الأدمن', 'رقم الأدمن', 'admin']) || ''),
            address: getCol(r, map, ['العنوان', 'address']) || '',
            salesCount: getCol(r, map, ['السيلز', 'عدد السيلز', 'sales']) || 0,
            soldUnits: getCol(r, map, ['المباعة', 'الوحدات المباعة', 'sold']) || 0,
            project: getCol(r, map, ['المشروع', 'اسم المشروع', 'project']) || '',
            unitNo: String(getCol(r, map, ['الوحدة', 'رقم الوحدة', 'unit']) || ''),
            building: String(getCol(r, map, ['العمارة', 'رقم العمارة', 'building']) || ''),
            floor: String(getCol(r, map, ['الدور', 'رقم الدور', 'floor']) || ''),
            lastFollowup: String(getCol(r, map, ['متابعة', 'آخر متابعة', 'followup']) || new Date().toISOString().slice(0,10)),
            comments: getCol(r, map, ['comments', 'ملاحظات']) || '',
            links: getCol(r, map, ['links', 'روابط', 'لينك']) || ''
          }));
          state.owners.unshift(...parsed);
          importedCount += parsed.length;
        } else if (target === 'brokers') {
          const parsed = parseTableByHeaders(rows, (map, r) => ({
            id: uid(),
            name: getCol(r, map, ['البروكر', 'اسم الشركة', 'الشركة', 'company', 'broker']) || sheetName,
            adminName: getCol(r, map, ['اسم الأدمن', 'الأدمن', 'admin']) || '',
            adminPhone: String(getCol(r, map, ['رقم الأدمن', 'الهاتف', 'phone']) || ''),
            projectsCount: getCol(r, map, ['المشاريع', 'عدد المشاريع', 'projects']) || 0,
            address: getCol(r, map, ['العنوان', 'address']) || '',
            groupLink: getCol(r, map, ['لينك', 'جروب', 'link', 'whatsapp']) || '',
            notes: getCol(r, map, ['ملاحظات', 'notes']) || ''
          }));
          state.brokers.unshift(...parsed);
          importedCount += parsed.length;
        }
      });

      saveState(); updateKPIs(); renderActiveSection();
      showToast(`تم سحب ${importedCount} سجل بنجاح من ${wb.SheetNames.length} تبويب`);
    } catch (err) {
      showToast('تعذر قراءة الملف، تأكدي من صيغة Excel أو CSV');
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseNum(v) {
  if (typeof v === 'number') return v;
  const n = Number(String(v || '').replace(/[^\d.]/g, ''));
  return isNaN(n) ? 0 : n;
}

function getCol(row, headerMap, keywords) {
  for (const kw of keywords) {
    for (const [colIdx, hText] of Object.entries(headerMap)) {
      if (hText.includes(kw.toLowerCase())) return row[colIdx];
    }
  }
  return '';
}

function parseTableByHeaders(rows, mapper) {
  let headerIdx = 0;
  for (let i = 0; i < Math.min(10, rows.length); i++) {
    const nonEmpty = rows[i].filter(c => String(c).trim() !== '').length;
    if (nonEmpty >= 2) { headerIdx = i; break; }
  }
  const map = {};
  rows[headerIdx].forEach((cell, idx) => { map[idx] = String(cell).trim().toLowerCase(); });
  const out = [];
  for (let r = headerIdx + 1; r < rows.length; r++) {
    if (rows[r].every(c => String(c).trim() === '')) continue;
    out.push(mapper(map, rows[r]));
  }
  return out;
}

// Smart Parser supporting BOTH Transposed Owner Sheets (e.g., Sales Inventory.xlsx) AND Standard Vertical Tables
function parseAnyUnitsSheet(rows, sheetName, category) {
  // Check if Transposed Developer Sheet (Col 0 contains 'رقم الوحدة' or 'مساحه')
  const unitHeaderRows = [];
  rows.forEach((r, idx) => {
    const c0 = String(r[0] || '').trim().toLowerCase();
    if (c0.includes('رقم الوحدة') || c0.includes('رقم الوحده') || c0 === 'unit' || c0 === 'unit no') {
      unitHeaderRows.push(idx);
    }
  });

  if (unitHeaderRows.length > 0) {
    const results = [];
    for (let b = 0; b < unitHeaderRows.length; b++) {
      const startRow = unitHeaderRows[b];
      const endRow = (b + 1 < unitHeaderRows.length) ? unitHeaderRows[b + 1] : rows.length;
      const headerRow = rows[startRow];
      for (let col = 1; col < headerRow.length; col++) {
        const unitCode = String(headerRow[col] || '').trim();
        if (!unitCode) continue;
        let area = 0, ppm = 0, price = 0, furnishedPrice = 0, finishing = '', garden = '', terrace = '', formNo = '', extraNotes = [];
        for (let r = startRow + 1; r < endRow; r++) {
          const lbl = String(rows[r][0] || '').trim().toLowerCase();
          const val = rows[r][col];
          if (val === '' || val === null || val === undefined) continue;
          const numVal = parseNum(val);
          if (lbl.includes('مساح')) area = numVal || val;
          else if (lbl.includes('سعر / م') || lbl.includes('سعر المتر')) ppm = numVal;
          else if (lbl.includes('بالفرش')) {
            if (numVal > 10000) furnishedPrice = numVal;
            if (!finishing) finishing = 'متشطب بالفرش';
          } else if (lbl.includes('بدون فرش') || lbl === 'متشطب' || lbl.includes('تشطيب')) {
            if (numVal > 10000) price = numVal;
            finishing = String(rows[r][0]).trim();
          } else if (lbl.includes('الاجمال') || lbl.includes('الإجمال') || lbl.includes('total')) {
            if (numVal > 0 && !price) price = numVal;
          } else if (lbl.includes('جاردن') || lbl.includes('garden')) {
            garden = String(val);
          } else if (lbl.includes('تراس') || lbl.includes('terrace')) {
            terrace = String(val);
          } else if (lbl.includes('استمار')) {
            formNo = String(val);
          } else {
            extraNotes.push(`${String(rows[r][0]).trim()}: ${val}`);
          }
        }
        if (!price && furnishedPrice) price = furnishedPrice;
        if (!price && ppm && area) price = Math.round(ppm * Number(area));
        results.push({
          id: uid(),
          category,
          type: category === 'commercial' ? 'وحدة تجارية' : 'وحدة سكنية',
          project: sheetName,
          location: '',
          building: sheetName,
          unitNo: unitCode,
          floor: '',
          area,
          pricePerMeter: ppm,
          price,
          furnishedPrice,
          garden,
          terrace,
          finishing: finishing || 'متشطب',
          paymentPlan: '',
          direction: '',
          view: '',
          formNo,
          notes: extraNotes.join(' • ')
        });
      }
    }
    return results;
  }

  // Standard Vertical Table
  return parseTableByHeaders(rows, (map, r) => {
    const rawFin = String(getCol(r, map, ['التشطيب', 'تشطيب', 'finishing']) || '');
    let price = parseNum(getCol(r, map, ['السعر', 'الاجمالي', 'الإجمالي', 'price', 'total']));
    let finishing = rawFin;
    if (!price && parseNum(rawFin) > 50000) {
      price = parseNum(rawFin);
      finishing = 'متشطب';
    }
    return {
      id: uid(),
      category,
      type: getCol(r, map, ['النوع', 'نوع العقار', 'نوع النشاط', 'type']) || (category === 'commercial' ? 'محل تجاري' : 'شقة'),
      project: getCol(r, map, ['المشروع', 'اسم المشروع', 'المول', 'project']) || sheetName,
      location: getCol(r, map, ['المكان', 'المنطقة', 'location', 'area']) || '',
      building: String(getCol(r, map, ['العمارة', 'رقم العمارة', 'building']) || ''),
      unitNo: String(getCol(r, map, ['رقم الوحدة', 'كود الوحدة', 'unit']) || ''),
      floor: String(getCol(r, map, ['الدور', 'رقم الدور', 'floor']) || ''),
      area: parseNum(getCol(r, map, ['المساحة', 'area', 'sqm'])),
      pricePerMeter: parseNum(getCol(r, map, ['سعر المتر', 'ppm'])),
      price,
      finishing,
      paymentPlan: getCol(r, map, ['السداد', 'نظام السداد', 'payment']) || '',
      direction: getCol(r, map, ['الاتجاه', 'direction']) || '',
      view: getCol(r, map, ['الفيو', 'view']) || '',
      notes: getCol(r, map, ['ملاحظات', 'تفاصيل', 'notes']) || ''
    };
  });
}
